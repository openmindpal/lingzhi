right_wrist_roll_joint = 0.0
right_wrist_pitch_joint = 0.0
right_wrist_yaw_joint = 0.0

# ── acquisition：G1 头部相机（标准 UVC——[样例] 设备节点实测后填）─
[[acquisition.cameras]]
kind = "builtin_v4l2"
device = "/dev/video0"
depth = false
intrinsics = { fx = 800.0, fy = 800.0, cx = 640.0, cy = 360.0 }

# ── 传感与数据面（对照规范 §2.5——[样例] 占位,字段级格式随合作交付）──
# 已声明: joint_state(rt/lowstate)——q/dq/tau + IMU 快照来源 ✓
# 待声明(选配硬件到位后): 腕部六维力×2 的接触力数据面
#   ——reach_contact 行(obs_contact=true, k=2: 0=左腕 1=右腕)要求
#   数据面声明路数 k=2 与之一致;无传感 = 该行不可交付(诚实缺帧)
# 音频(麦克风/扬声器): 语音交互选配,acquisition 扩展段声明

# ── policies：四族策略交付清单 ─────────────────────────────────
# 契约规格（观测布局/动作语义/ONNX IO/时序/校验）唯一权威：
#   《四族策略技术需求与训练指南》（随合作交付）
# 装载校验：family ∈ {balance,manipulation,deform,expression}；obs_dim ∈ 合法宽度集
# （J=29、motor_fields 未声明 → b=3：基础 97 / +goal 101 / +contact 109）
# 权重文件由厂商交付至包内 policies/ 目录——派发时装载，缺失 = 诚实报错。
[[policies.rows]]
name = "balance_hold"
family = "balance"
weights = "policies/balance.onnx"
frequency_hz = 100.0                  # 与 [protocol] frequency_hz 同步——起步 100Hz
priority = "task"
obs_dim = 97                          # 3×29 + imu(10)

[[policies.rows]]
name = "reach_goal"
family = "manipulation"
weights = "policies/reach.onnx"
frequency_hz = 100.0
priority = "task"
obs_dim = 101                         # 97 + goal(4)
goal_conditioned = true

[[policies.rows]]
name = "reach_contact"
family = "manipulation"
weights = "policies/reach_contact.onnx"
frequency_hz = 100.0
priority = "task"
obs_dim = 109                         # 97 + contact(12,k=2:0=左腕 1=右腕——路序包文档化)
obs_contact = true

[[policies.rows]]
name = "deform_ramp"
family = "deform"
weights = "policies/deform.onnx"
frequency_hz = 100.0
priority = "task"
obs_dim = 97

# ── fastbrains：快脑槽（战术层实例——引擎内零快脑逻辑）────────
# 装载校验：kind ∈ {onnx}；goal_stream 交叉校验须对应 policies.rows；
# 权重输入 = 肌肉同源观测展平(3×29+10=97) + 当前 goal(4)，输出 = goal(4)
[[policies.rows]]
name = "greet_wave"
family = "expression"
weights = "policies/greet_wave.onnx"
frequency_hz = 100.0
priority = "task"
obs_dim = 97

[[fastbrains.rows]]
name = "tactician"
kind = "onnx"
weights = "fastbrains/tactician.onnx"
outputs = { goal_stream = "reach_goal" }
when_to_use = 'reach_goal 策略的战术层——按 q0 反馈持续微调 goal_x(闭环演示脑)'
rate_hz = 50.0
budget_ms = 60000
