channels = [22, 23, 24, 25, 26, 27, 28]       # 肩p/肩r/肩y/肘/腕r/腕p/腕y
ik_pair = [0, 3]                              # 矢状面 IK 驱动对 = 肩pitch + 肘（channels 位）
plane_channel = 1                             # 摆动平面朝向 = 肩roll（channels 位——aim/trace 先转平面）

