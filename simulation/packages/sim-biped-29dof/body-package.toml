# ─────────────────────────────────────────────────────────────

#
# J=29（左腿6/右腿6/腰3/左臂7/右臂7）= state_order = 模型关节文档序。
# motor_fields q+dq+tau → b_max=3：基础宽度 3·29=87，+IMU=97，+goal=101（§6.3 宽度集）。
# 肘中立位 -0.75（软域 [-1.45,-0.05] 内——containment 装载校验，同款理由见夹具包）。
# ─────────────────────────────────────────────────────────────

[core]
package_name = "sim-biped-29dof"
version = "0.1.0"
word_schema_version = 1
abi_version = 1
runtime_min = "0.9.0"
certified_by = "sim-local"

[protocol]
transport = "dds"
frequency_hz = 50
heartbeat_ms = 20
timeout_ms = 100

[protocol.joint_mapping]
ordered = [
  "left_hip_pitch_joint", "left_hip_roll_joint", "left_hip_yaw_joint",
  "left_knee_joint", "left_ankle_pitch_joint", "left_ankle_roll_joint",
  "right_hip_pitch_joint", "right_hip_roll_joint", "right_hip_yaw_joint",
  "right_knee_joint", "right_ankle_pitch_joint", "right_ankle_roll_joint",
  "waist_yaw_joint", "waist_roll_joint", "waist_pitch_joint",
  "left_shoulder_pitch_joint", "left_shoulder_roll_joint", "left_shoulder_yaw_joint",
  "left_elbow_joint", "left_wrist_roll_joint", "left_wrist_pitch_joint", "left_wrist_yaw_joint",
  "right_shoulder_pitch_joint", "right_shoulder_roll_joint", "right_shoulder_yaw_joint",
  "right_elbow_joint", "right_wrist_roll_joint", "right_wrist_pitch_joint", "right_wrist_yaw_joint",
]

[protocol.dds]
domain_id = 42
participant_name = "mindpal-agent"

[protocol.dds.actuator_topics.joint_cmd]
topic_name = "mp/sim/biped29/lowcmd"
type_name = "mindpal::JointTargets"
reliability = "reliable"
history_depth = 1

[protocol.dds.sensor_topics.joint_state]
topic_name = "mp/sim/biped29/lowstate"
type_name = "mindpal::JointStates"
reliability = "best_effort"
history_depth = 1
motor_fields = ["f32:q", "f32:dq", "f32:tau"]

[protocol.dds.qos]
preset = "control"

[profile]
body_height_m = 1.32
state_order = [
  "left_hip_pitch_joint", "left_hip_roll_joint", "left_hip_yaw_joint",
  "left_knee_joint", "left_ankle_pitch_joint", "left_ankle_roll_joint",
  "right_hip_pitch_joint", "right_hip_roll_joint", "right_hip_yaw_joint",
  "right_knee_joint", "right_ankle_pitch_joint", "right_ankle_roll_joint",
  "waist_yaw_joint", "waist_roll_joint", "waist_pitch_joint",
  "left_shoulder_pitch_joint", "left_shoulder_roll_joint", "left_shoulder_yaw_joint",
  "left_elbow_joint", "left_wrist_roll_joint", "left_wrist_pitch_joint", "left_wrist_yaw_joint",
  "right_shoulder_pitch_joint", "right_shoulder_roll_joint", "right_shoulder_yaw_joint",
  "right_elbow_joint", "right_wrist_roll_joint", "right_wrist_pitch_joint", "right_wrist_yaw_joint",
]
gaze_anchor = "waist_yaw_joint"       # G1 无头颈自由度——腰偏航（夹具包同款）

[profile.joints.left_hip_pitch_joint]
dh = { a = 0.0, alpha = 0.0, d = 0.0, theta = 0.0 }
limits = { min = -2.5, max = 3.0 }
sign = 1
group = "left_leg"

[profile.joints.left_hip_roll_joint]
dh = { a = 0.0, alpha = 0.0, d = 0.0, theta = 0.0 }
limits = { min = -0.5, max = 0.5 }
sign = 1
group = "left_leg"

[profile.joints.left_hip_yaw_joint]
