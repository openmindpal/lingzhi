# 运动模式级原语: 倒水(流体动力学代理)——manipulation 制式实例
# 流体代理 = 杯内 N 粒自由小球(真实洒出动力学——杯的加速/倾斜驱动粒子)
# 杯焊右腕(持杯姿态);goal = 倾倒目标点(认知给);判据 = 粒子逃逸 ≤ 阈 + 移动到位
# 诚实说明: 粒子代理 = 流体的参考级近似(真 SPH 流体不在 MuJoCo 参考后端范围)——
#           洒出机制(加速度/倾斜驱动)真实,粒子行为与真水有差异
name: family_pour
row_name: pour_hold
kind: policy
family: manipulation
obs_mode: goal
priority: task
control_hz: 50
episode_s: 5
action_scale: 0.3
soft_limit_margin: 0.05
assets: {objects: true, cup_on_hand: true}
pour: {particles: 24, cup_half: [0.035, 0.035, 0.05], hand_off: [0.0, -0.04, 0.02]}
goal_box: [[0.30, 0.45], [-0.35, -0.10], [0.15, 0.30]]   # 倾倒目标点(基座系)
goal_f_range: [0.0, 1.0]
randomize: {imu_noise: 0.005, encoder_noise: 0.003}
reward: {spill: 3.0, ee_err: 0.5, action_rate: 0.02, tau: 0.001}
gate: {water_escaped: 1}
