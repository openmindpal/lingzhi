# 运动模式级原语: 工具使用(手-工具-物体三级力链)——manipulation 制式实例
# 力学结构 = 工具成为手的延伸: 抓握稳定(工具姿态) + 力传递链(手部出力→工具→物体)
#   三个子模式由 goal_f 连续参数化: 轻触(0)→常规操作(0.5)→冲击(1.0)
# 工具质心/握点偏移进入动力学(工具=刚体扩展);物体作用目标 = 认知给
# 判据 = 工具末端对物体的作用效果(作用点位移/冲量/扭矩——按子模式) + 全程不掉工具
name: family_tool
row_name: tool_use
kind: policy
family: manipulation
obs_mode: goal
priority: task
control_hz: 50
episode_s: 8
action_scale: 0.25
soft_limit_margin: 0.05
assets: {objects: true, tool: true}
tool: {rigid_body: true, grasp_offset_m: 0.10, mass_kg: [0.1, 1.5]}
goal_box: [[0.25, 0.50], [-0.35, 0.35], [0.15, 0.45]]   # 工具作用目标域(基座系)
goal_f_range: [0.0, 1.0]                                 # 子模式连续谱
randomize: {imu_noise: 0.003, encoder_noise: 0.002, tool_mass_jitter: 0.3}
reward: {tool_effect: 18.0, grasp_hold: 4.0, ee_err: 0.5, action_rate: 0.01, tau: 0.001, drop: -8.0}
gate: {tool_task_success: 1}
