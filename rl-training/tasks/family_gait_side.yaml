# gait 风格实例: 侧移步态——balance 制式实例(多实例口径 §7.1,每档一行认知按行名派发)
name: family_gait_side
row_name: gait_side
kind: policy
family: balance
obs_mode: base
priority: task
control_hz: 50
episode_s: 8
action_scale: 0.35
soft_limit_margin: 0.05
gait:
  target: {vx: 0.0, vy: 0.40, wz: 0.0}   # 侧移 0.40 m/s
randomize: {imu_noise: 0.005, encoder_noise: 0.003, mass_jitter: 0.2, friction_jitter: 0.3}
reward: {vel: 1.0, alive: 0.5, upright: 1.0, action_rate: 0.01, tau: 0.001}
gate: {vel_err: 0.30, survive: 0.95}
