# 运动模式级原语: 步态行走——balance 制式实例(多实例口径)
# 契约(§7.1): cmd_vel 已废除——行走速度/步态风格 = 多实例行,每速度档一训,认知按行名派发
# 本实例 = 自然档(0.75 m/s 前进);慢踱/快走 = 复制本 yaml 改 row_name + target 即可
# 力学结构 = 动态行走(与站立不同:支撑/摆动腿交替的周期性接触动力学)
name: family_gait
row_name: gait_walk
kind: policy
family: balance
obs_mode: base
priority: task
control_hz: 50
episode_s: 8
action_scale: 0.35
soft_limit_margin: 0.05
# 步态目标速度(实例速度档——行走 m/s)
gait:
  target: {vx: 0.75, vy: 0.0, wz: 0.0}   # 自然档:前进 0.75 m/s 直行
randomize: {imu_noise: 0.005, encoder_noise: 0.003, mass_jitter: 0.2, friction_jitter: 0.3}
reward: {vel: 1.0, alive: 0.5, upright: 1.0, action_rate: 0.01, tau: 0.001}
gate: {vel_err: 0.35, survive: 0.95}     # 速度跟踪误差 ≤0.35 m/s + 全程不摔
