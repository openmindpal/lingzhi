# 运动模式级原语: 人机物理交互(握手/搀扶/递物力度自适应)——manipulation 制式实例(contact)
# 力学结构 = 变阻抗跟随: 对人的出力感知→阻抗实时调整(人主导度 f 连续——0=全主动 1=全跟随)
#   安全硬约束 = 人侧力上限(超出即让步——力联锁语义的柔顺版,过量事件=失败)
# 判据 = 人侧舒适力域内完成交互(过力事件=0) + 交互任务完成
name: family_phys_interact
row_name: phys_assist
kind: policy
family: manipulation
obs_mode: contact
priority: task
control_hz: 50
episode_s: 8
action_scale: 0.20
soft_limit_margin: 0.05
assets: {objects: true, human_proxy: true}
human: {force_limit_n: [10.0, 80.0]}
randomize: {imu_noise: 0.003, encoder_noise: 0.002, human_force_jitter: 0.3}
reward: {comfort_force: 16.0, follow_err: 3.0, action_rate: 0.01, over_force: -12.0}
gate: {over_force_events: 0, task_done: 1}
